services:
  - type: web
    name: ecocampus
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 2 --threads 4
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: FLASK_DEBUG
        value: "0"
      - key: CORS_ORIGINS
        value: "*"
